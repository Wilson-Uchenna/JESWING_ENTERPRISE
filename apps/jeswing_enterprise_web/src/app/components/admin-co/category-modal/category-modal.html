<!-- Controlled by store.modalOpen() — render this wherever you need it -->
@if (store.modalOpen()) {

  <!-- Backdrop -->
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm"
    (click)="close()"
  >
    <!-- Panel -->
    <div
      class="relative w-full max-w-md mx-4 bg-[#1a2235] rounded-xl shadow-2xl border border-white/[0.06]"
      (click)="$event.stopPropagation()"
    >

      <!-- Header -->
      <div class="flex items-center justify-between px-6 pt-6 pb-4">
        <h2 class="text-lg font-bold tracking-wide text-white">Add New Category</h2>
        <button
          (click)="close()"
          class="w-7 h-7 flex items-center justify-center rounded text-white/40 hover:text-white hover:bg-white/10 transition-colors"
        >
          <fa-icon [icon]="faXmark" class="text-sm" />
        </button>
      </div>

      <div class="h-px bg-white/[0.06] mx-6"></div>

      <!-- Body -->
      <div class="px-6 pt-5 pb-6 space-y-5">

        <!-- Server error banner -->
        @if (store.hasError()) {
          <div class="flex items-center justify-between gap-3 bg-red-500/10 border border-red-500/20 rounded-lg px-4 py-2.5">
            <p class="text-xs text-red-400">{{ store.error() }}</p>
            <button (click)="store.clearError()" class="text-red-400/60 hover:text-red-400 text-xs">✕</button>
          </div>
        }

        <!-- Category Name -->
        <div class="space-y-2">
          <label class="block text-[10px] font-bold tracking-widest text-white/40 uppercase">
            Category Name
          </label>
          <input
            type="text"
            [(ngModel)]="name"
            placeholder="e.g. Heavy Machinery"
            class="w-full bg-[#0e1525] border border-white/[0.08] rounded-lg px-4 py-3 text-sm text-white placeholder-white/20 outline-none
                   focus:border-[#ff6200]/60 focus:ring-1 focus:ring-[#ff6200]/30 transition-all"
          />
        </div>

        <!-- Category Description -->
        <div class="space-y-2">
          <label class="block text-[10px] font-bold tracking-widest text-white/40 uppercase">
            Category Description
          </label>
          <textarea
            [(ngModel)]="description"
            placeholder="Describe the purpose of this category..."
            rows="4"
            class="w-full bg-[#0e1525] border border-white/[0.08] rounded-lg px-4 py-3 text-sm text-white placeholder-white/20 outline-none resize-none
                   focus:border-[#ff6200]/60 focus:ring-1 focus:ring-[#ff6200]/30 transition-all"
          ></textarea>
        </div>

        <!-- Thumbnail -->
        <!-- <div class="space-y-2">
          <label class="block text-[10px] font-bold tracking-widest text-white/40 uppercase">
            Category Thumbnail
          </label>
          <label
            class="relative flex flex-col items-center justify-center w-full h-36 rounded-lg border border-dashed cursor-pointer overflow-hidden transition-all"
            [class.border-[#ff6200]]="isDragging()"
            [class.bg-[#ff6200]/5]="isDragging()"
            [class.border-white/10]="!isDragging()"
            [class.bg-[#0e1525]]="!isDragging()"
            (dragover)="onDragOver($event)"
            (dragleave)="onDragLeave()"
            (drop)="onDrop($event)"
          >
            @if (previewUrl()) {
              <img [src]="previewUrl()" alt="preview" class="absolute inset-0 w-full h-full object-cover opacity-60" />
              <span class="relative text-[11px] text-white/60 bg-black/40 px-2 py-1 rounded">Click to change</span>
            } @else {
              <fa-icon [icon]="faImage" class="text-2xl text-white/20 mb-2" />
              <span class="text-xs text-white/30">Click or drag to upload image</span>
            }
            <input type="file" accept="image/*" class="hidden" (change)="onFileSelected($event)" />
          </label>
        </div> -->

      </div>

      <div class="h-px bg-white/[0.06] mx-6"></div>

      <!-- Footer -->
      <div class="flex items-center justify-end gap-3 px-6 py-4">
        <button
          (click)="close()"
          [disabled]="store.saving()"
          class="px-5 py-2.5 rounded-lg text-sm font-semibold text-white/50 hover:text-white hover:bg-white/5 disabled:opacity-40 transition-colors"
        >
          Cancel
        </button>
        <button
          (click)="submit()"
          [disabled]="!name().trim() || store.saving()"
          class="relative px-6 py-2.5 rounded-lg text-sm font-bold tracking-wide bg-[#ff6200] text-white
                 hover:bg-[#e55700] disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
        >
          @if (store.saving()) {
            <span class="flex items-center gap-2">
              <span class="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
              Creating...
            </span>
          } @else {
            Create Category
          }
        </button>
      </div>

    </div>
  </div>

}
