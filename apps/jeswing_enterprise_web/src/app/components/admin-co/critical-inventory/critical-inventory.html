<div class="bg-[#131b30] border border-white/[0.06] rounded-lg p-5">
      <div class="flex items-center gap-2 mb-4">
        <svg width="13" height="13" fill="#ef4444" viewBox="0 0 16 16">
          <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
        </svg>
        <p class="font-semibold text-sm tracking-wide">Critical Inventory</p>
      </div>
 
      <div class="space-y-3">
        @for (item of items; track item.sku) {
          <div [class]="'border-l-2 rounded-r p-3 ' + severityClasses(item.severity).border + ' ' + severityClasses(item.severity).bg">
            <div class="flex items-center justify-between mb-1">
              <p class="text-xs font-semibold text-white/80 leading-tight">{{ item.name }}</p>
              <span [class]="'text-[10px] font-bold ' + severityClasses(item.severity).qty">
                {{ item.qty }} left
              </span>
            </div>
            <p class="text-[10px] text-white/25 mb-2">{{ item.sku }}</p>
            <div class="flex items-center justify-between">
              <span [class]="'text-[10px] uppercase tracking-wide ' + severityClasses(item.severity).statusText">
                Status: {{ item.statusLabel }}
              </span>
              @if (item.action === 'reorder') {
                <button class="bg-red-500 text-white text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded">
                  REORDER
                </button>
              } @else if (item.action === 'restock') {
                <button class="bg-amber-500 text-white text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded">
                  RESTOCK
                </button>
              } @else {
                <span [class]="'text-[10px] font-bold uppercase tracking-wide ' + severityClasses(item.severity).statusText">
                  Inventory
                </span>
              }
            </div>
          </div>
        }
      </div>
    </div>
