 <div class="grid grid-cols-4 gap-4">
      @for (card of cards; track card.label) {
        <div class="bg-[#131b30] border border-white/[0.06] rounded-lg p-4">
          <div class="flex items-center justify-between mb-3">
            <p class="text-[10px] tracking-widest text-white/35 uppercase">{{ card.label }}</p>
            <span [class]="card.badgeClass + ' text-[10px] font-bold px-2 py-0.5 rounded'">
              {{ card.badge }}
            </span>
          </div>
          <p class="text-2xl font-bold font-mono tracking-tight">{{ card.value }}</p>
          <p class="text-[11px] text-white/30 mt-1">{{ card.sub }}</p>
        </div>
      }
    </div>
