<section
  class="bg-white/5 backdrop-blur-md border border-white/10 shadow-[inset_0_0_20px_rgba(168,85,247,0.08),inset_0_0_40px_rgba(234,179,8,0.04)] rounded-2xl px-3 py-4"
>
  <div
    class="container mx-auto px-4 py-6 flex justify-between items-center gap-x-20"
  >
    <div class="flex flex-col gap-4 max-w-md">
      <div
        class="border-slate-500 border-1 bg-transparent rounded-xl px-4 py-1 flex items-center gap-2 max-w-xs"
      >
        <span class="relative flex h-2 w-2">
          <span
            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-500 opacity-75"
          ></span>
          <span
            class="relative inline-flex h-2 w-2 rounded-full bg-orange-500"
          ></span>
        </span>
        <p class="text-md font-bold text-white">BACK TO SCHOOL & OFFICE SALE</p>
      </div>

      <h1 class="text-6xl font-bold text-white">
        Everything for <span class="text-orange-400">Work, School & Home</span>
      </h1>
      <p class="text-gray-600">
        From precision calculators and notebooks to durable mops and storage
        solutions. We organize your life, one item at a time.
      </p>
      <div class="flex gap-3 mt-8">
        <a
            routerLink="/store"
            class="relative flex items-center gap-3 bg-[#ff6200] hover:bg-[#e55700] text-white text-xs font-bold  uppercase px-6 py-3 rounded transition-all duration-200 hover:gap-4"
          >
            <span
              class="absolute inset-0 bg-orange-100  group-hover:translate-x-0 transition-transform duration-300 ease-in-out"
            ></span>
            <span class="relative z-10">Store</span>
          </a>
        <button class="btn btn-outline">Browse Household</button>
      </div>
    </div>

    <div class="relative w-full max-w-lg group">
      <!-- Glowing border -->
      <div
        class="absolute inset-0 rounded-2xl border-2 border-purple-500 blur-sm opacity-60 -z-10"
      ></div>

      <!-- Image container -->
      <div
        class="relative rounded-2xl overflow-hidden border-2 border-purple-500 rotate-3 group-hover:rotate-0 transition-transform duration-500 ease-out cursor-pointer"
      >
        <img src="unnamed.png" alt="Banner image" class="w-full object-cover" />

        <!-- Top-left badge -->
        <div
          class="absolute top-4 left-4 flex items-center gap-2 bg-gray-900 text-white px-3 py-2 rounded-xl animate-bounce"
        >
          <div class="bg-purple-600 p-1.5 rounded-lg">🎓</div>
          <div class="flex flex-col leading-tight">
            <span class="text-xs text-gray-400">Student</span>
            <span class="text-sm font-bold">Essentials</span>
          </div>
        </div>

        <!-- Bottom-right badge -->
        <div
          class="absolute bottom-4 right-4 flex items-center gap-2 bg-gray-900 text-white px-3 py-2 rounded-xl animate-bounce [animation-delay:300ms]"
        >
          <div class="bg-green-500 p-1.5 rounded-lg">🏠</div>
          <div class="flex flex-col leading-tight">
            <span class="text-xs text-gray-400">Home</span>
            <span class="text-sm font-bold">Supplies</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
