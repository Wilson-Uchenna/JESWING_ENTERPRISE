<section class="relative container mx-auto px-3 py-6">
  <!-- Your actual section content goes here -->
  <h2 class="text-white font-bold text-xl">
    <fa-icon [icon]="faCubesStacked" class="text-sm mb-8"></fa-icon> Shop By
    Category
  </h2>
  <div class="grid grid-cols-6 gap-4 text-white mt-4 font-bold">
    <div
      class="rounded-2xl px-4 py-4 border border-1 bg-white/5 backdrop-blur-md border border-white/10 shadow-[inset_0_0_20px_rgba(168,85,247,0.08),inset_0_0_40px_rgba(234,179,8,0.04)] flex flex-col items-center justify-between"
    >
      <div
        class="bg-blue-500/20 rounded-full flex items-center justify-center w-15 h-15 mx-auto mb-2 font-bold"
      >
        <fa-icon
          [icon]="faFilePen"
          class="text-xl"
          style="color: rgb(116, 192, 252)"
        ></fa-icon>
      </div>
      Stationery
    </div>
    <div
      class="rounded-2xl px-4 py-4 border border-1 bg-white/5 backdrop-blur-md border border-white/10 shadow-[inset_0_0_20px_rgba(168,85,247,0.08),inset_0_0_40px_rgba(234,179,8,0.04)] flex flex-col items-center justify-between"
    >
      <div
        class="bg-orange-500/20 rounded-full flex items-center justify-center w-15 h-15 mx-auto"
      >
        <fa-icon
          [icon]="faTableColumns"
          class="text-xl"
          style="color: rgb(236, 138, 14)"
        ></fa-icon>
      </div>
      Office Supplies
    </div>
    <div
      class="rounded-2xl px-4 py-4 border border-1 bg-white/5 backdrop-blur-md border border-white/10 shadow-[inset_0_0_20px_rgba(168,85,247,0.08),inset_0_0_40px_rgba(234,179,8,0.04)] flex flex-col items-center justify-between"
    >
      <div
        class="bg-green-500/20 mx-auto rounded-full flex items-center justify-center w-15 h-15 opacity-60"
      >
        <fa-icon
          [icon]="faBroom"
          class="text-xl"
          style="color: rgb(99, 230, 190)"
        ></fa-icon>
      </div>
      Household
    </div>
    <div
      class="rounded-2xl px-4 py-4 border border-1 bg-white/5 backdrop-blur-md border border-white/10 shadow-[inset_0_0_20px_rgba(168,85,247,0.08),inset_0_0_40px_rgba(234,179,8,0.04)] flex flex-col justify-between items-center"
    >
      <div
        class="bg-purple-500/20 mx-auto rounded-full flex items-center justify-center w-15 h-15 opacity-60"
      >
        <fa-icon
          [icon]="faBoxArchive"
          class="text-xl"
          style="color: rgb(177, 151, 252)"
        ></fa-icon>
      </div>
      Storage
    </div>
    <div
      class="rounded-2xl px-4 py-4 border border-1 bg-white/5 backdrop-blur-md border border-white/10 shadow-[inset_0_0_20px_rgba(168,85,247,0.08),inset_0_0_40px_rgba(234,179,8,0.04)] flex flex-col items-center justify-between"
    >
      <div
        class="bg-red-600/20 mx-auto rounded-full flex items-center justify-center w-15 h-15 opacity-60"
      >
        <fa-icon
          [icon]="faCalculator"
          class="text-xl"
          style="color: rgb(210, 55, 26)"
        ></fa-icon>
      </div>
      Student Gear
    </div>
    <div
      class="rounded-2xl px-4 py-4 border border-1 bg-white/5 backdrop-blur-md border border-white/10 shadow-[inset_0_0_20px_rgba(168,85,247,0.08),inset_0_0_40px_rgba(234,179,8,0.04)] flex flex-col items-center justify-between"
    >
      <div
        class="bg-cyan-500/20 mx-auto rounded-full flex items-center justify-center w-15 h-15 opacity-60"
      >
        <fa-icon
          [icon]="faPumpSoap"
          class="text-xl"
          style="color: rgb(27, 216, 231)"
        ></fa-icon>
      </div>
      Cleaning
    </div>
  </div>
</section>
